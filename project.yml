name: Asciiquarium

options:
  bundleIdPrefix: com.makeitappenlabs
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_HARDENED_RUNTIME: YES
    # Ad-hoc ("Sign to Run Locally") until the Developer ID setup in the release task.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

packages:
  AquariumKit:
    path: .
    group: ""

targets:
  Asciiquarium:
    type: bundle
    platform: macOS
    scheme: {}
    sources:
      - path: Saver
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Asciiquarium
        PRODUCT_BUNDLE_IDENTIFIER: com.makeitappenlabs.asciiquarium
        WRAPPER_EXTENSION: saver
        INFOPLIST_FILE: Saver/Info.plist
        INSTALL_PATH: $(HOME)/Library/Screen Savers
        # Keep thumbnail.png and thumbnail@2x.png as separate files; the system looks for those names.
        COMBINE_HIDPI_IMAGES: NO
    dependencies:
      - package: AquariumKit
      - sdk: ScreenSaver.framework

  AsciiquariumPreview:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: Saver
        excludes:
          - Info.plist
          - Resources/**
      - path: Shared
      - path: PreviewApp
    settings:
      base:
        PRODUCT_NAME: AsciiquariumPreview
        PRODUCT_BUNDLE_IDENTIFIER: com.makeitappenlabs.asciiquarium.preview
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Asciiquarium Preview
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        # Dev-only harness: a Release archive or install must never include it.
        SKIP_INSTALL: YES
    dependencies:
      - package: AquariumKit
      - sdk: ScreenSaver.framework

  AsciiquariumTV:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    scheme:
      testTargets:
        - AsciiquariumTVUITests
    sources:
      - path: TV
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: AsciiquariumTV
        PRODUCT_BUNDLE_IDENTIFIER: com.makeitappenlabs.asciiquarium.tv
        # The TV app is versioned on its own; the Mac saver uses the base MARKETING_VERSION.
        MARKETING_VERSION: 1.1.0
        INFOPLIST_FILE: TV/Info.plist
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ENABLE_HARDENED_RUNTIME: NO
        # Automatic signing with the team passed on the command line (DEVELOPMENT_TEAM=...) for a
        # real Apple TV; the team ID is never committed. Simulator and CI builds need none.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: AquariumKit

  # Presses the remote in the simulator and keeps screenshots: Xcode has no on-screen remote.
  AsciiquariumTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: TVUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.makeitappenlabs.asciiquarium.tv.uitests
        TEST_TARGET_NAME: AsciiquariumTV
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: AsciiquariumTV

schemes:
  AquariumKit:
    # XcodeGen needs one build target; the package tests build AquariumKit themselves.
    build:
      targets:
        Asciiquarium: [run]
    test:
      targets:
        - package: AquariumKit/AquariumKitTests
